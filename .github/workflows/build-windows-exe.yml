name: Build Windows EXE

# Triggers:
#   - Push a version tag:  git tag v1.0.0 && git push origin v1.0.0
#   - Manually from the GitHub Actions tab (Actions → Build Windows EXE → Run workflow)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Required so the workflow can create GitHub Releases and upload assets.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ─────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install deps ───────────────────────────────────────────────────
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "."

      - name: Install PyInstaller
        run: pip install pyinstaller

      # ── 4. Build ──────────────────────────────────────────────────────────
      - name: Build onedir Windows EXE
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --noupx `
            --name desktop_launcher `
            --collect-all matplotlib `
            --collect-all ezdxf `
            --collect-all PIL `
            --collect-all rich `
            desktop_launcher.py
        shell: pwsh

      # ── 5. Zip the output folder ──────────────────────────────────────────
      - name: Zip dist folder
        run: Compress-Archive -Path dist\desktop_launcher\* -DestinationPath dist\CAD-Eval-Windows.zip
        shell: pwsh

      # ── 6. Upload artifact (always available, even without a release) ─────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAD-Eval-Windows
          path: dist\CAD-Eval-Windows.zip
          retention-days: 30

      # ── 7. Attach to GitHub Release (only on tag pushes) ──────────────────
      - name: Create GitHub Release and attach EXE
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\CAD-Eval-Windows.zip
          generate_release_notes: true
