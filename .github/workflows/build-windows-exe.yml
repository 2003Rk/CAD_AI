name: Build Windows EXE

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ezdxf Pillow matplotlib numpy google-genai scipy jinja2 pydantic pydantic-settings click rich python-dotenv openpyxl gspread google-api-python-client fastapi "uvicorn[standard]"
          pip install pyinstaller
        shell: cmd

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm --clean --windowed --onedir --noupx --name desktop_launcher --collect-all matplotlib --collect-all ezdxf --collect-all PIL --collect-all rich desktop_launcher.py
        shell: cmd

      - name: Zip output folder
        run: Compress-Archive -Path dist\desktop_launcher\* -DestinationPath dist\CAD-Eval-Windows.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAD-Eval-Windows
          path: dist\CAD-Eval-Windows.zip
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\CAD-Eval-Windows.zip
          generate_release_notes: true

