<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAD AI 評価ランナー</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --ink: #10243e;
      --muted: #5f7087;
      --brand: #0f5ea8;
      --brand-2: #1890d8;
      --ok: #177245;
      --err: #b3261e;
      --line: #d9e2ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", "Segoe UI", sans-serif;
      color: var(--ink);
      background: radial-gradient(1200px 600px at 20% -10%, #e3f0ff, transparent), var(--bg);
    }
    .wrap {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(16, 36, 62, 0.06);
      padding: 16px;
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    .sub { color: var(--muted); margin: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      align-items: end;
    }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    select, input, button {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
      background: #fff;
    }
    .btn {
      background: linear-gradient(120deg, var(--brand), var(--brand-2));
      color: #fff;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-sm {
      width: auto;
      min-height: 32px;
      padding: 4px 12px;
      font-size: 13px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .status.idle   { color: var(--muted); }
    .status.running { color: var(--brand); }
    .status.success { color: var(--ok); }
    .status.error   { color: var(--err); }
    .progress-wrap { margin-top: 12px; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #e7eef6;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
      background: linear-gradient(120deg, var(--brand), var(--brand-2));
    }
    pre {
      margin: 0;
      padding: 12px;
      border-radius: 10px;
      background: #0f1722;
      color: #cdd8e7;
      border: 1px solid #25374f;
      min-height: 320px;
      max-height: 55vh;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .links a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 600;
      margin-right: 12px;
    }
    .links a:hover { text-decoration: underline; }
    .backend-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .backend-row input { flex: 1; }
    .err-msg { color: var(--err); font-size: 12px; margin-top: 6px; }
    /* PIN gate */
    #pin-gate {
      position: fixed;
      inset: 0;
      background: radial-gradient(1200px 600px at 20% -10%, #e3f0ff, transparent), var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #pin-gate .pin-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 6px 28px rgba(16, 36, 62, 0.12);
      padding: 36px 32px;
      width: 340px;
      text-align: center;
    }
    #pin-gate h2 { margin: 0 0 8px; font-size: 22px; }
    #pin-gate .pin-sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    .pin-input-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    #pin-input {
      letter-spacing: 0.25em;
      font-size: 20px;
      text-align: center;
      padding-right: 44px;
      width: 100%;
    }
    #pin-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      min-height: unset;
      width: auto;
    }
    #pin-eye:hover { color: var(--ink); }
    #pin-error { color: var(--err); font-size: 12px; margin-top: 10px; min-height: 16px; }
  </style>
</head>
<body>

  <!-- PIN gate — hidden by JS once the correct PIN is confirmed -->
  <div id="pin-gate">
    <div class="pin-card">
      <h2>CAD AI 評価ランナー</h2>
      <p class="pin-sub">アクセスPINを入力してください</p>
      <div class="pin-input-wrap">
        <input id="pin-input" type="password" placeholder="PIN"
               autocomplete="off"
               onkeydown="if(event.key==='Enter')submitPin()" />
        <button id="pin-eye" type="button" onclick="togglePinVisibility()" title="パスワードを表示">&#x1F441;</button>
      </div>
      <button class="btn" style="width:100%" onclick="submitPin()">アクセス</button>
      <div id="pin-error"></div>
    </div>
  </div>

  <div class="wrap">

    <!-- Header -->
    <section class="card">
      <h1>CAD AI 評価ランナー</h1>
      <p class="sub">ワンクリックパイプライン: データセット生成 → DXF変換 → Gemini CAD生成 → スコアリング → レポート</p>
    </section>

    <!-- Backend URL config -->
    <section class="card">
      <label for="backendUrl">バックエンド URL</label>
      <div class="backend-row">
        <input id="backendUrl" type="url" placeholder="http://localhost:8000" />
        <button class="btn btn-sm" onclick="saveBackendUrl()">保存</button>
        <button class="btn btn-sm" style="background:var(--muted)" onclick="testBackend()">テスト</button>
      </div>
      <div id="backendMsg" class="err-msg"></div>
    </section>

    <!-- Controls -->
    <section class="card">
      <div class="grid">
        <div>
          <label for="pattern">プロンプトパターン</label>
          <select id="pattern">
            <option value="all" selected>すべて (1 + 2 + 3)</option>
            <option value="1">パターン 1</option>
            <option value="2">パターン 2</option>
            <option value="3">パターン 3</option>
          </select>
        </div>
        <div>
          <button id="startBtn" class="btn" onclick="startRun()">パイプライン開始</button>
        </div>
        <div>
          <span id="statusEl" class="status idle">待機中</span>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="progressLabel">未開始</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-track">
          <div id="progressBar" class="progress-fill"></div>
        </div>
        <div id="uiMessage" class="err-msg"></div>
      </div>
    </section>

    <!-- Report links -->
    <section class="card">
      <div class="links">
        <a id="linkHtml" href="#" target="_blank">HTMLレポートを開く</a>
        <a id="linkJson" href="#" target="_blank">JSONレポートをダウンロード</a>
        <a id="linkXlsx" href="#" target="_blank">Excelレポートをダウンロード</a>
      </div>
    </section>

    <!-- Live logs -->
    <section class="card">
      <h3 style="margin-top:0">ライブログ</h3>
      <pre id="logs"></pre>
    </section>

  </div>

  <script>
    // ---- PIN authentication ----
    const PIN_KEY = 'cad_eval_pin';

    function getPin() {
      return sessionStorage.getItem(PIN_KEY) || '';
    }

    function authHeaders(extra) {
      return Object.assign({ 'Content-Type': 'application/json', 'Authorization': `Bearer ${getPin()}` }, extra || {});
    }

    function togglePinVisibility() {
      const inp = document.getElementById('pin-input');
      const btn = document.getElementById('pin-eye');
      if (inp.type === 'password') {
        inp.type = 'text';
        btn.innerHTML = '&#x1F648;'; // eye closed
        btn.title = 'パスワードを隠す';
      } else {
        inp.type = 'password';
        btn.innerHTML = '&#x1F441;'; // eye open
        btn.title = 'パスワードを表示';
      }
    }

    const _CORRECT_PIN = 'CAD9090';

    function submitPin() {
      const pin   = document.getElementById('pin-input').value.trim();
      const errEl = document.getElementById('pin-error');
      errEl.textContent = '';
      if (!pin) { errEl.textContent = 'PINを入力してください'; return; }

      if (pin !== _CORRECT_PIN) {
        errEl.textContent = 'PINが正しくありません';
        document.getElementById('pin-input').value = '';
        document.getElementById('pin-input').focus();
        return;
      }

      sessionStorage.setItem(PIN_KEY, pin);
      document.getElementById('pin-gate').style.display = 'none';
      updateReportLinks(getBackendUrl());
      setInterval(poll, 1500);
      poll();
    }

    // ---- Backend URL ----
    // When served via Docker Compose (nginx proxies /api/* to the API container),
    // leave this empty so requests use the same origin.
    // When running the frontend standalone, set this to http://your-backend-host:8000.
    const STORAGE_KEY  = 'cad_eval_backend_url';
    const DEFAULT_URL  = '';   // empty = same origin (works with Docker Compose nginx proxy)

    function getBackendUrl() {
      return (localStorage.getItem(STORAGE_KEY) || DEFAULT_URL).replace(/\/$/, '');
    }

    function saveBackendUrl() {
      const val = document.getElementById('backendUrl').value.trim().replace(/\/$/, '');
      if (!val) return;
      localStorage.setItem(STORAGE_KEY, val);
      updateReportLinks(val);
      document.getElementById('backendMsg').textContent = '保存しました。';
      setTimeout(() => document.getElementById('backendMsg').textContent = '', 2000);
    }

    async function testBackend() {
      const url = document.getElementById('backendUrl').value.trim().replace(/\/$/, '') || getBackendUrl();
      const msg = document.getElementById('backendMsg');
      try {
        const res = await fetch(`${url}/health`, { cache: 'no-store' });
        if (res.ok) {
          msg.style.color = 'var(--ok)';
          msg.textContent = '接続に成功しました。';
        } else {
          msg.style.color = 'var(--err)';
          msg.textContent = `バックエンドが HTTP ${res.status} を返しました。`;
        }
      } catch {
        msg.style.color = 'var(--err)';
        msg.textContent = 'バックエンドに接続できません。URLを確認し、サーバーが起動していることを確認してください。';
      }
      setTimeout(() => { msg.textContent = ''; msg.style.color = ''; }, 4000);
    }

    function updateReportLinks(base) {
      const pin = getPin();
      const q   = pin ? `?pin=${encodeURIComponent(pin)}` : '';
      document.getElementById('linkHtml').href  = `${base}/reports/html${q}`;
      document.getElementById('linkJson').href  = `${base}/reports/json${q}`;
      document.getElementById('linkXlsx').href  = `${base}/reports/xlsx${q}`;
    }

    // ---- Status helpers ----
    const STATUS_LABELS = { idle: '待機中', running: '実行中', success: '成功', error: 'エラー' };
    const STAGE_LABELS  = {
      idle: '待機中', starting: '開始中', dataset: 'データセット生成中',
      convert: '画像変換中', generate: 'CAD生成中', evaluate: '評価中',
      compare: '比較中', reports: 'レポート作成中', done: '完了',
    };

    function setStatus(status) {
      const el = document.getElementById('statusEl');
      el.className = `status ${status}`;
      el.textContent = STATUS_LABELS[status] || status;
    }

    // ---- Pipeline control ----
    async function startRun() {
      const backend = getBackendUrl();
      const pattern = document.getElementById('pattern').value;
      const msg = document.getElementById('uiMessage');
      msg.textContent = '';
      setStatus('running');
      document.getElementById('startBtn').disabled = true;
      document.getElementById('progressLabel').textContent = '開始中 — リクエスト受付済み';

      try {
        const res = await fetch(`${backend}/api/start`, {
          method: 'POST',
          headers: authHeaders(),
          cache: 'no-store',
          body: JSON.stringify({ pattern }),
        });
        const data = await res.json();
        if (!res.ok) {
          setStatus('idle');
          document.getElementById('startBtn').disabled = false;
          msg.textContent = data.detail || data.error || 'パイプラインを開始できませんでした。';
          return;
        }
      } catch {
        setStatus('error');
        document.getElementById('startBtn').disabled = false;
        msg.textContent = 'バックエンドに接続できませんでした。上記のバックエンドURLを確認してください。';
        return;
      }
      poll();
    }

    async function poll() {
      const backend = getBackendUrl();
      try {
        const res  = await fetch(`${backend}/api/status`, { cache: 'no-store', headers: { 'Authorization': `Bearer ${getPin()}` } });
        const data = await res.json();
        document.getElementById('uiMessage').textContent = '';
        setStatus(data.status);

        const logs = document.getElementById('logs');
        logs.textContent = (data.logs || []).join('\n');
        logs.scrollTop = logs.scrollHeight;

        document.getElementById('startBtn').disabled = data.status === 'running';

        const p      = data.progress || {};
        const pct    = typeof p.percent === 'number' ? p.percent : 0;
        const bar    = document.getElementById('progressBar');
        bar.style.width = `${Math.max(0, Math.min(100, pct))}%`;
        document.getElementById('progressPct').textContent = `${pct.toFixed(1)}%`;

        const stage     = p.stage || 'idle';
        const current   = p.current || 0;
        const total     = p.count_total || 0;
        const countText = total > 0 ? ` (${current}/${total})` : '';
        const detail    = p.detail ? ` — ${p.detail}` : '';
        document.getElementById('progressLabel').textContent =
          `${STAGE_LABELS[stage] || stage}${countText}${detail}`;

      } catch {
        setStatus('error');
        document.getElementById('uiMessage').textContent =
          'バックエンドへの接続が切断されました。サーバーが起動していることを確認してください。';
      }
    }

    // ---- Boot ----
    (function init() {
      const url = getBackendUrl();
      document.getElementById('backendUrl').value = url;

      if (getPin()) {
        // Already authenticated this session — skip the PIN gate
        document.getElementById('pin-gate').style.display = 'none';
        updateReportLinks(url);
        setInterval(poll, 1500);
        poll();
      }
      // If not authenticated, the PIN gate overlay remains visible.
      // Polling starts after a successful PIN entry via submitPin().
    })();
  </script>
</body>
</html>
