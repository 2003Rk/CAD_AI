# Fly.io config for the CAD Eval static frontend
# App name must be globally unique on Fly.io.
# Change "cad-eval-frontend" below if it's already taken.

app            = "cad-eval-frontend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.frontend.fly"

[http_service]
  internal_port       = 80
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "256mb"
