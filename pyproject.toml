[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-ai-eval"
version = "1.0.0"
description = "AI-powered CAD generation evaluation pipeline using Gemini"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "ezdxf>=1.3.0",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "google-genai>=1.0.0",
    "scipy>=1.12",
    "jinja2>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "gspread>=6.0",
    "google-api-python-client>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.3"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.29"]

[project.scripts]
cad-eval = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
